<style>
  :root{
    --ink:#2B2118;
    --paper:#F5F3EF;
    --card:#FFFFFF;
    --line:#E1DBCD;
    --amber:#B99A5B;
    --amber-deep:#8A6D34;
    --sage:#3F4A5C;
    --muted:#6E6759;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:32px 16px 64px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  .stamp{display:flex;align-items:center;gap:14px;margin-bottom:28px;}
  .stamp-mark{
    width:56px;height:56px;border-radius:50%;
    border:2.5px solid var(--amber);
    display:flex;align-items:center;justify-content:center;
    background:#fff;
    overflow:hidden;
    flex-shrink:0;
  }
  .stamp-mark img{width:100%;height:100%;object-fit:contain;padding:6px;}
  .stamp-text .eyebrow{
    font-size:12px;letter-spacing:.12em;color:var(--muted);
    text-transform:uppercase;margin-bottom:2px;
  }
  h1{
    font-family:'Tajawal',sans-serif;font-weight:900;
    font-size:clamp(24px,4vw,30px);margin:0;color:var(--ink);
  }

  .intro{font-size:14.5px;color:var(--muted);line-height:1.8;margin-bottom:26px;}

  .dept-list{display:flex;flex-direction:column;gap:12px;}
  .dept-card{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:4px;
    padding:18px 20px;text-decoration:none;color:var(--ink);
    box-shadow:0 1px 0 var(--line);position:relative;overflow:hidden;
    transition:transform .12s, border-color .12s;
  }
  .dept-card::before{
    content:"";position:absolute;top:0;right:0;bottom:0;width:5px;
    background:linear-gradient(180deg,var(--amber),var(--sage));
  }
  .dept-card:active{transform:scale(.98);}
  .dept-name{font-family:'Tajawal',sans-serif;font-weight:700;font-size:16.5px;}
  .dept-arrow{color:var(--amber-deep);font-size:20px;flex-shrink:0;}

  .footer-note{text-align:center;margin-top:30px;font-size:12.5px;color:var(--muted);line-height:1.7;}
</style>
</head>

      <h1>نماذج طلبات الإجازة</h1>

  <p class="intro">اختر القسم المطلوب لفتح نموذج طلب الإجازة الخاص به. سيتم إرسال الطلب لجهة الاعتماد المختصة، ولن يصل للمستلم الرئيسي إلا بعد الموافقة.</p>
